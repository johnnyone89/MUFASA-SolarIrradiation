name: One-time terminology and data integrity update

on:
  push:
    paths:
      - '.github/trigger-terminology-fix'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace deprecated solar-radiation wording in notebook
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('notebooks/MUFASA_Public_Release.ipynb')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'solar radiation': 'solar irradiation',
              'Solar radiation': 'Solar irradiation',
              'solar-radiation': 'solar-irradiation',
              'Solar-radiation': 'Solar-irradiation',
          }
          changed = 0
          for old, new in replacements.items():
              n = text.count(old)
              if n:
                  text = text.replace(old, new)
                  changed += n
          path.write_text(text, encoding='utf-8')
          print(f'Replaced {changed} deprecated terminology occurrence(s) in {path}.')
          PY

      - name: Validate all six city datasets and regenerate checksums
        shell: bash
        run: |
          python -m pip install --quiet pandas
          python scripts/validate_data.py

      - name: Verify deprecated wording is absent from release text/code
        shell: bash
        run: |
          if grep -Rni --exclude='*.csv' --exclude='checksums.sha256' --exclude='normalize-solar-terminology.yml' --exclude-dir='.git' 'solar radiation\|solar-radiation' README.md RELEASE_CHECKLIST.md data notebooks scripts release_manifest.json; then
            echo 'Deprecated solar-radiation wording remains.' >&2
            exit 1
          fi

      - name: Commit normalized notebook and regenerated checksums
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/MUFASA_Public_Release.ipynb data/checksums.sha256
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Normalize solar irradiation terminology and refresh checksums'
            git push
          fi
